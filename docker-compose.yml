services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: palmers-crm-app
    ports:
      - "18081:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:18081
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: crm_palmers
      DB_USERNAME: palmers
      DB_PASSWORD: secret
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:5.7
    container_name: palmers-crm-db
    environment:
      MYSQL_DATABASE: crm_palmers
      MYSQL_USER: palmers
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
  vendor_data:
